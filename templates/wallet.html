<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的優惠錢包</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: 'Helvetica Neue', Arial, sans-serif; }
        .header { background-color: #769382; color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .coupon-card { background: white; border-radius: 12px; border-left: 6px solid #d32f2f; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden; }
        .coupon-body { padding: 15px; }
        .vendor-name { font-size: 1.1em; color: #555; margin-bottom: 5px; }
        .coupon-text { font-size: 1.4em; font-weight: bold; color: #333; margin-bottom: 10px; }
        .qr-section { background-color: #fafafa; padding: 15px; text-align: center; border-top: 1px dashed #ddd; }
        .qr-image { width: 120px; height: 120px; border-radius: 8px; border: 1px solid #eee; padding: 5px; background: white; }
        .serial-text { margin-top: 10px; font-family: monospace; font-size: 1.2em; font-weight: bold; letter-spacing: 2px; color: #d32f2f; }
        .empty-state { text-align: center; padding: 50px 20px; color: #999; }
    </style>
</head>
<body>

    <div class="header">
        <h3 class="mb-0">🎟️ 我的優惠錢包</h3>
        <p class="mb-0 mt-2" style="font-size: 0.9em; opacity: 0.9;">結帳時請向店員出示條碼</p>
    </div>

    <div class="container" id="walletContainer">
        <div class="text-center text-muted my-5" id="loadingText">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2">正在載入您的錢包...</p>
        </div>
    </div>

    <script>
        // 替換成妳的 LIFF ID (需要去 LINE Developers 開一個新的 LIFF app 對應到 /wallet 網址)
        const LIFF_ID = "請在此填入妳錢包專屬的LIFF_ID"; 

        window.onload = async function() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                const profile = await liff.getProfile();
                fetchWallet(profile.userId);
            } catch (err) {
                document.getElementById('walletContainer').innerHTML = `<div class="empty-state">❌ LIFF 初始化失敗</div>`;
            }
        };

        async function fetchWallet(userId) {
            try {
                const response = await fetch(`/api/wallet/${userId}`);
                const coupons = await response.json();
                
                const container = document.getElementById('walletContainer');
                container.innerHTML = "";

                if (coupons.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h4 style="color: #666;">錢包空空如也 💨</h4>
                            <p>趕快去尋找公廁並留下評價，<br>每累積 5 則就能獲得驚喜折價券喔！</p>
                        </div>
                    `;
                    return;
                }

                coupons.forEach(c => {
                    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${c.serial_code}`;
                    // 灰階效果：如果以後擴充「已使用」功能，可以用 c.is_used 來判斷是否套用 filter: grayscale(100%)
                    const cardHtml = `
                        <div class="coupon-card">
                            <div class="coupon-body">
                                <div class="vendor-name">${c.vendor_name}</div>
                                <div class="coupon-text">${c.coupon_text}</div>
                                <span class="badge bg-secondary">${c.target_keyword}</span>
                                <small class="text-muted ms-2">獲得時間：${c.get_time}</small>
                            </div>
                            <div class="qr-section">
                                <img src="${qrUrl}" class="qr-image" alt="QR Code">
                                <div class="serial-text">${c.serial_code}</div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHtml;
                });

            } catch (err) {
                document.getElementById('walletContainer').innerHTML = `<div class="empty-state">伺服器連線異常，請稍後再試。</div>`;
            }
        }
    </script>
</body>
</html>
