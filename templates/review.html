<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>留下你的評價</title>

    <!-- 引入 LINE 官方的 LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <!-- 引入 SweetAlert2 來做超美彈跳視窗 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* 美編CSS */
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .stars { font-size: 2em; color: #ccc; cursor: pointer; }
        .star.active { color: #f5c518; }
        textarea { 
                width: 100%; 
                height: 100px; 
                margin-top: 15px; 
                padding: 10px; 
                font-size: 16px !important; /* 強制字體大小，防止 iOS 自動放大 */
                box-sizing: border-box; /* 避免 padding 把輸入框撐開超過螢幕 */
        }
        button { background-color: #769382; color: white; border: none; padding: 10px 20px; margin-top: 20px; border-radius: 5px; width: 100%; font-size: 1.2em; }
    </style>
</head>
<body>

    <h2 id="toiletName">載入廁所資訊中...</h2>
    
    <p>請給這間廁所幾顆星？</p>
    <div class="stars" id="starContainer">
        <!-- 美編星星圖案 -->
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
    </div>

    <textarea id="comment" placeholder="這間廁所有衛生紙嗎？乾淨嗎？留言分享一下吧！"></textarea>
    
    <button id="submitBtn" onclick="submitReview()">送出評價</button>

    <script>

        // 這是 JavaScript 邏輯       
        let selectedStars = 0;
        let toiletId = "未知廁所";

        // 1. 初始化 LIFF 應用程式
        async function initializeLiff() {
            try {
                // 正確 LIFF ID
                await liff.init({ liffId: "2011608763-NWNQFgKI" });
                
                if (!liff.isLoggedIn()) {
                    liff.login(); // 如果沒登入，逼他登入
                }

                // 2. 從網址抓取是哪間廁所
                const urlParams = new URLSearchParams(window.location.search);
                toiletId = urlParams.get('toilet_id') || "未知廁所";
                document.getElementById('toiletName').innerText = `正在評價：${toiletId}`;

            } catch (err) {
                console.error("LIFF 初始化失敗", err);
            }
        }

        // 3. 處理星星點擊的視覺效果
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', function() {
                selectedStars = this.getAttribute('data-value');
                document.querySelectorAll('.star').forEach(s => {
                    s.classList.remove('active');
                    if (s.getAttribute('data-value') <= selectedStars) {
                        s.classList.add('active');
                    }
                });
            });
        });

        // 4. 送出評價給 Flask 後端
        async function submitReview() {
            try {
                if (selectedStars === 0) {
                    alert("請至少給一顆星喔！");
                    return;
                }

                const comment = document.getElementById('comment').value;
                const profile = await liff.getProfile();
                const userId = profile.userId;
                const response = await fetch('/api/review', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        toilet_name: toiletId,
                        stars: selectedStars,
                        comment: comment
                    })
                });

                // 新增：先解析後端傳回來的 JSON 資料
                const result = await response.json();

                if (result.reward === true) {
                        // 狀態 1：🎉 中獎了
                        const serialCode = Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + 
                                           Math.random().toString(36).substring(2, 6).toUpperCase();
                        const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${serialCode}`;

                        Swal.fire({
                            title: '🎉 幸運中獎',
                            html: `
                                <p>這是您的第 <b>${result.review_count}</b> 則評價！</p>
                                <p>獲得專屬優惠：<br><strong style="color:#d33; font-size:1.2em;">【${result.coupon_data.vendor_name}】${result.coupon_data.coupon_text}</strong></p>
                                <div style="margin: 15px 0;">
                                    <img src="${qrCodeUrl}" alt="QR Code" style="border: 2px solid #eee; border-radius: 10px; padding: 5px;">
                                </div>
                                <p style="font-size: 0.9em; color: #666;">兌換序號：${serialCode}</p>
                                <p style="font-size: 0.8em; color: #999;">請向店員出示此畫面掃描核銷</p>
                            `,
                            icon: 'success',
                            confirmButtonText: '開心收下',
                            confirmButtonColor: '#769382',
                            allowOutsideClick: false
                        }).then(() => {
                            liff.closeWindow(); 
                        });

                    } else if (result.is_draw_time === true) {
                        // 狀態 2：💨 有抽獎，但銘謝惠顧
                        Swal.fire({
                            title: '銘謝惠顧',
                            text: `評價送出成功！這是您的第 ${result.review_count} 則評價，可惜這次沒有抽中折價券。再累積 5 則獲得下一次抽獎機會吧！`,
                            icon: 'info',
                            confirmButtonText: '再接再厲',
                            confirmButtonColor: '#95a5a6'
                        }).then(() => {
                            liff.closeWindow();
                        });

                    } else {
                        // 狀態 3：⏳ 一般累積中
                        const remainCount = 5 - (result.review_count % 5);
                        Swal.fire({
                            title: '✅ 評價送出成功！',
                            text: `感謝分享！您目前已累積 ${result.review_count} 則評價，只要再 ${remainCount} 則，就能解鎖下一次的【隨機折價券抽獎機會】喔！`,
                            icon: 'success',
                            confirmButtonText: '確定',
                            confirmButtonColor: '#769382'
                        }).then(() => {
                            liff.closeWindow();
                        });
                    }

            } catch (err) {
                // 如果過程中有任何當機，手機會直接彈出這段錯誤訊息！
                alert("錯誤原因：" + err.message);
            }
        }
        // 網頁載入時立刻啟動 LIFF
        initializeLiff();

        // 5. 終極防護：當留言框失去焦點 (鍵盤收合) 時，強制把網頁滑回最頂端
        document.getElementById('comment').addEventListener('blur', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
