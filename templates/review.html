<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 確保在手機上看起來比例正確 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留下你的評價</title>
    <!-- 引入 LINE 官方的 LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        /* 美編CSS */
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .stars { font-size: 2em; color: #ccc; cursor: pointer; }
        .star.active { color: #f5c518; }
        textarea { width: 100%; height: 100px; margin-top: 15px; padding: 10px; }
        button { background-color: #769382; color: white; border: none; padding: 10px 20px; margin-top: 20px; border-radius: 5px; width: 100%; font-size: 1.2em; }
    </style>
</head>
<body>

    <h2 id="toiletName">載入廁所資訊中...</h2>
    
    <p>請給這間廁所幾顆星？</p>
    <div class="stars" id="starContainer">
        <!-- 美編星星圖案 -->
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
    </div>

    <textarea id="comment" placeholder="這間廁所有衛生紙嗎？乾淨嗎？留言分享一下吧！"></textarea>
    
    <button id="submitBtn" onclick="submitReview()">送出評價</button>

    <script>

        // 這是 JavaScript 邏輯       
        let selectedStars = 0;
        let toiletId = "未知廁所";

        // 1. 初始化 LIFF 應用程式
        async function initializeLiff() {
            try {
                // 正確 LIFF ID
                await liff.init({ liffId: "2011608763-NWNQFgKI" });
                
                if (!liff.isLoggedIn()) {
                    liff.login(); // 如果沒登入，逼他登入
                }

                // 2. 從網址抓取是哪間廁所
                const urlParams = new URLSearchParams(window.location.search);
                toiletId = urlParams.get('toilet_id') || "未知廁所";
                document.getElementById('toiletName').innerText = `正在評價：${toiletId}`;

            } catch (err) {
                console.error("LIFF 初始化失敗", err);
            }
        }

        // 3. 處理星星點擊的視覺效果
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', function() {
                selectedStars = this.getAttribute('data-value');
                document.querySelectorAll('.star').forEach(s => {
                    s.classList.remove('active');
                    if (s.getAttribute('data-value') <= selectedStars) {
                        s.classList.add('active');
                    }
                });
            });
        });

        // 4. 送出評價給 Flask 後端
        async function submitReview() {
            try {
                if (selectedStars === 0) {
                    alert("請至少給一顆星喔！");
                    return;
                }

                const comment = document.getElementById('comment').value;
                const profile = await liff.getProfile();
                const userId = profile.userId;
                const response = await fetch('/api/review', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        toilet_name: toiletId,
                        stars: selectedStars,
                        comment: comment
                    })
                });

                // 新增：先解析後端傳回來的 JSON 資料
                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    // 🌟 核心修改：檢查後端有沒有傳回中獎通知 (reward: true)
                    if (result.reward === true) {
                        alert(
                            `🎉 這是您的第 ${result.review_count} 則評價！\n\n` +
                            `系統贈送您專屬優惠：\n` +
                            `🎁【${result.coupon_data.vendor_name}】${result.coupon_data.coupon_text}\n\n` +
                            `請截圖此畫面至店家兌換！`
                        );
                    } else {
                        // 一般的成功訊息，用進度條心理學鼓勵他繼續留言
                        alert(`✅ 評價送出成功，感謝分享！\n(您目前已累積 ${result.review_count} 則評價，滿 3 則即可解鎖隱藏商圈優惠喔！)`);
                    }
                    
                    liff.closeWindow(); // 視窗按確定後自動關閉
                } else {
                    alert("❌ 儲存失敗：" + (result.message || response.status));
                }

            } catch (err) {
                // 如果過程中有任何當機，手機會直接彈出這段錯誤訊息！
                alert("錯誤原因：" + err.message);
            }
        }

        // 網頁載入時立刻啟動 LIFF
        initializeLiff();
    </script>
</body>
</html>
