<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找廁所系統 - 營運管理後台</title>
    <!-- 直接引入 Bootstrap 幫我們美化網頁 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .admin-header { background-color: #2c3e50; color: white; padding: 20px 0; margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="admin-header text-center">
        <h2>🛠️ 找廁所系統 - 營運管理後台</h2>
    </div>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0 pt-2 pb-2">📋 評價審查列表</h4>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>廁所名稱</th>
                            <th>星數</th>
                            <th>評論內容</th>
                            <th>留言時間</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="reviewTableBody">
                        <!-- 資料會透過底下的 JavaScript 動態生出來 -->
                        <tr><td colspan="6" class="text-center">資料載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 一進網頁就去後台 API 撈取所有評價
        async function loadAdminReviews() {
            try {
                const response = await fetch('/api/admin/reviews');
                const data = await response.json();
                
                const tbody = document.getElementById('reviewTableBody');
                tbody.innerHTML = ""; // 清空載入中文字

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">目前系統內沒有任何評價。</td></tr>';
                    return;
                }

                // 把每一筆評價畫成表格裡的一行 (tr)
                data.forEach(review => {
                    let stars = "⭐".repeat(review.stars);
                    let comment = review.comment ? review.comment : '<span class="text-muted">無文字評論</span>';
                    
                    const row = `
                        <tr>
                            <td>#${review.id}</td>
                            <td class="fw-bold text-success">${review.toilet_name}</td>
                            <td>${stars}</td>
                            <td>${comment}</td>
                            <td><small class="text-muted">${review.created_at}</small></td>
                            <td>
                                <button class="btn btn-danger btn-sm" onclick="deleteReview(${review.id})">
                                    🗑️ 刪除
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

            } catch (err) {
                alert("無法連線到伺服器，請檢查網路狀態！");
            }
        }

        // 點擊刪除按鈕時執行的功能
        async function deleteReview(id) {
            // 跳出確認視窗，避免手滑誤刪
            if (!confirm(`確定要刪除 ID 為 #${id} 的這筆評價嗎？此操作無法復原！`)) {
                return; 
            }

            try {
                // 呼叫我們剛剛寫的 DELETE API
                const response = await fetch(`/api/admin/reviews/${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.status === "success") {
                    alert("✅ 評價已成功刪除！");
                    loadAdminReviews(); // 重新整理表格
                } else {
                    alert("❌ 刪除失敗：" + result.message);
                }
            } catch (err) {
                alert("系統錯誤，無法刪除！");
            }
        }

        // 啟動函數
        window.onload = loadAdminReviews;
    </script>
</body>
</html>
