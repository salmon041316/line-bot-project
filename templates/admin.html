<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找廁所系統 - 營運管理後台</title>
    <!-- 引入 Bootstrap 美化網頁 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .admin-header { background-color: #2c3e50; color: white; padding: 20px 0; margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="admin-header text-center">
        <h2>🛠️ 找廁所系統 - 營運管理後台</h2>
    </div>

    <!-- ================= 登入區塊 ================= -->
    <div class="container" id="loginSection" style="max-width: 400px; margin-top: 80px;">
        <div class="card shadow">
            <div class="card-header bg-white text-center pt-3 pb-3">
                <h4 class="mb-0">🔐 管理員登入</h4>
            </div>
            <div class="card-body p-4">
                <div class="mb-3">
                    <input type="password" id="adminPwd" class="form-control" placeholder="請輸入管理密碼">
                </div>
                <button class="btn btn-primary w-100 fw-bold" onclick="verifyLogin()">登入系統</button>
            </div>
        </div>
    </div>

    <!-- ================= 系統管理主畫面 (預設隱藏) ================= -->
    <div class="container" id="adminSection" style="display: none; max-width: 1000px;">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">歡迎登入，系統管理員</h4>
            <button class="btn btn-outline-secondary" onclick="logout()">登出</button>
        </div>

        <!-- 💰 OMO 折價券發布中心 -->
        <div class="card shadow-sm mb-4 border-warning">
            <div class="card-header bg-warning text-dark fw-bold pt-2 pb-2">
                💰 OMO 廠商折價券發布中心
            </div>
            <div class="card-body">
                <div class="row g-3 mb-3">
                    <div class="col-md-2">
                        <input type="text" id="vendorName" class="form-control" placeholder="廠商 (例: 全家)">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="couponText" class="form-control" placeholder="優惠 (例: 拿鐵折10元)">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="targetKeyword" class="form-control" placeholder="備註 (例: 秋季行銷)">
                    </div>
                    <div class="col-md-2">
                        <input type="number" id="couponQuantity" class="form-control" placeholder="數量 (例: 100)" min="1">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-warning w-100 fw-bold" onclick="publishCoupon()">發布</button>
                    </div>
                </div>
                
                <table class="table table-sm table-hover align-middle mt-3">
                    <thead class="table-light">
                        <tr>
                            <th>廠商</th>
                            <th>優惠內容</th>
                            <th>活動備註</th>
                            <th>發行總數</th>
                            <th>剩餘庫存</th>
                        </tr>
                    </thead>
                    <tbody id="couponTableBody">
                        <tr><td colspan="5" class="text-center text-muted">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 📋 評價審查列表 -->
        <div class="card shadow-sm mb-5">
            <div class="card-header bg-white fw-bold pt-2 pb-2">
                📋 評價審查列表
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>廁所名稱</th>
                            <th>星數</th>
                            <th>評論內容</th>
                            <th>留言時間</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="reviewTableBody">
                        <!-- 資料動態產生 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 用來暫存成功登入的密碼
        let savedPwd = "";

        // 1. 驗證密碼並登入
        async function verifyLogin() {
            const pwdInput = document.getElementById('adminPwd').value.trim();
            if (!pwdInput) {
                alert("請輸入密碼！");
                return;
            }

            try {
                // 帶著密碼去敲評價 API 測試權限
                const response = await fetch(`/api/admin/reviews?pwd=${encodeURIComponent(pwdInput)}`);
                
                if (response.status === 401) {
                    alert("❌ 密碼錯誤，您無權限訪問！");
                    return;
                }

                // 密碼正確：把密碼存起來，切換畫面顯示
                savedPwd = pwdInput;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
                
                // 同時撈取評價與折價券資料
                refreshAllData();
                
            } catch (err) {
                alert("伺服器連線失敗，請稍後再試！");
            }
        }

        // 2. 重新整理所有資料 (評價 + 折價券)
        async function refreshAllData() {
            try {
                // 抓評價
                const revRes = await fetch(`/api/admin/reviews?pwd=${encodeURIComponent(savedPwd)}`);
                const revData = await revRes.json();
                renderReviews(revData);

                // 抓折價券
                const coupRes = await fetch(`/api/admin/coupons?pwd=${encodeURIComponent(savedPwd)}`);
                const coupData = await coupRes.json();
                renderCoupons(coupData);
            } catch (err) {
                console.error("讀取資料發生錯誤:", err);
            }
        }

        // 3. 將評價資料畫成表格
        function renderReviews(data) {
            const tbody = document.getElementById('reviewTableBody');
            tbody.innerHTML = ""; 

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">目前系統內沒有任何評價。</td></tr>';
                return;
            }

            data.forEach(review => {
                let stars = "⭐".repeat(review.stars);
                let comment = review.comment ? review.comment : '<span class="text-muted">無文字評論</span>';
                
                const row = `
                    <tr>
                        <td>#${review.id}</td>
                        <td class="fw-bold text-success">${review.toilet_name}</td>
                        <td>${stars}</td>
                        <td>${comment}</td>
                        <td><small class="text-muted">${review.created_at}</small></td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deleteReview(${review.id})">
                                🗑️ 刪除
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
