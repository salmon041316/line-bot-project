<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找廁所系統 - 營運管理後台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .admin-header { background-color: #2c3e50; color: white; padding: 20px 0; margin-bottom: 30px; }
    </style>
</head>
<body>

    <div class="admin-header text-center">
        <h2>🛠️ 找廁所系統 - 營運管理後台</h2>
    </div>

    <!-- ================= 登入區塊 ================= -->
    <div class="container" id="loginSection" style="max-width: 400px; margin-top: 80px;">
        <div class="card shadow">
            <div class="card-header bg-white text-center pt-3 pb-3">
                <h4 class="mb-0">🔐 管理員登入</h4>
            </div>
            <div class="card-body p-4">
                <div class="mb-3">
                    <input type="password" id="adminPwd" class="form-control" placeholder="請輸入管理密碼">
                </div>
                <button class="btn btn-primary w-100 fw-bold" onclick="verifyLogin()">登入系統</button>
            </div>
        </div>
    </div>

    <!-- ================= 評價管理區塊 (預設隱藏) ================= -->
    <div class="container" id="adminSection" style="display: none;">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0 pt-2 pb-2">📋 評價審查列表</h4>
                <button class="btn btn-outline-secondary btn-sm" onclick="logout()">登出</button>
            </div>
            <div class="card-body">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>廁所名稱</th>
                            <th>星數</th>
                            <th>評論內容</th>
                            <th>留言時間</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="reviewTableBody">
                        <!-- 資料動態產生 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 用來暫存成功登入的密碼
        let savedPwd = "";

        // 1. 驗證密碼並登入
        async function verifyLogin() {
            const pwdInput = document.getElementById('adminPwd').value.trim();
            if (!pwdInput) {
                alert("請輸入密碼！");
                return;
            }

            try {
                // 帶著密碼去敲門 (GET)
                const response = await fetch(`/api/admin/reviews?pwd=${encodeURIComponent(pwdInput)}`);
                
                if (response.status === 401) {
                    alert("❌ 密碼錯誤，您無權限訪問！");
                    return;
                }

                const data = await response.json();
                
                // 密碼正確：把密碼存起來，切換畫面顯示
                savedPwd = pwdInput;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
                
                // 印出表格資料
                renderTable(data);
                
            } catch (err) {
                alert("伺服器連線失敗，請稍後再試！");
            }
        }

        // 2. 將撈到的資料畫成表格
        function renderTable(data) {
            const tbody = document.getElementById('reviewTableBody');
            tbody.innerHTML = ""; 

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">目前系統內沒有任何評價。</td></tr>';
                return;
            }

            data.forEach(review => {
                let stars = "⭐".repeat(review.stars);
                let comment = review.comment ? review.comment : '<span class="text-muted">無文字評論</span>';
                
                const row = `
                    <tr>
                        <td>#${review.id}</td>
                        <td class="fw-bold text-success">${review.toilet_name}</td>
                        <td>${stars}</td>
                        <td>${comment}</td>
                        <td><small class="text-muted">${review.created_at}</small></td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deleteReview(${review.id})">
                                🗑️ 刪除
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // 3. 刪除評價 (需帶上暫存的密碼)
        async function deleteReview(id) {
            if (!confirm(`確定要刪除 ID 為 #${id} 的這筆評價嗎？此操作無法復原！`)) {
                return; 
            }

            try {
                // 呼叫 DELETE API 並帶上密碼參數
                const response = await fetch(`/api/admin/reviews/${id}?pwd=${encodeURIComponent(savedPwd)}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.status === "success") {
                    alert("✅ 評價已成功刪除！");
                    refreshData(); // 刪除成功後重新抓取最新資料
                } else {
                    alert("❌ 刪除失敗：" + result.message);
                }
            } catch (err) {
                alert("系統錯誤，無法刪除！");
            }
        }

        // 4. 重新整理資料
        async function refreshData() {
            const response = await fetch(`/api/admin/reviews?pwd=${encodeURIComponent(savedPwd)}`);
            const data = await response.json();
            renderTable(data);
        }

        // 5. 登出功能
        function logout() {
            savedPwd = "";
            document.getElementById('adminPwd').value = "";
            document.getElementById('adminSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }
    </script>
</body>
</html>
